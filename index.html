<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>都道府県・県庁所在地マッチングゲーム</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f0f4f8;
            --card-pref-bg: #3498db;
            --card-city-bg: #e67e22;
            --text-white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-drag: 0 10px 20px rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* ヘッダー・スコアエリア */
        header {
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .timer-display { color: var(--primary-color); }
        .highscore-display { color: var(--accent-color); }

        /* ゲームエリア */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1.2;
            margin-bottom: 20px;
            position: relative;
        }

        /* カードスタイル */
        .card {
            background-color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-white);
            box-shadow: var(--shadow);
            cursor: grab;
            transition: transform 0.2s, opacity 0.3s;
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 5px;
            line-height: 1.2;
        }

        .card:active { cursor: grabbing; }

        .card.type-pref { background: linear-gradient(135deg, #3498db, #2980b9); }
        .card.type-city { background: linear-gradient(135deg, #e67e22, #d35400); }

        .card.dragging {
            position: fixed;
            z-index: 1000;
            opacity: 0.9;
            transform: scale(1.1);
            box-shadow: var(--shadow-drag);
            pointer-events: none;
        }

        .card.matched { animation: popOut 0.5s forwards; }
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; pointer-events: none; }
        }

        .card.shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .placeholder {
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            border: 2px dashed rgba(0,0,0,0.1);
        }

        /* 共通ボタン */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 0.3s, transform 0.1s;
            touch-action: manipulation;
            margin: 5px;
            min-width: 160px;
        }
        .btn:hover { background-color: #34495e; }
        .btn:active { transform: scale(0.98); }
        .btn-accent { background-color: var(--accent-color); }
        .btn-accent:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #95a5a6; }
        .btn-secondary:hover { background-color: #7f8c8d; }

        /* オーバーレイ（スタート画面・リザルト・ランキング共通） */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: white;
            color: var(--primary-color);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* ランキングテーブル */
        .ranking-table {
            width: 100%;
            margin: 15px 0;
            border-collapse: collapse;
            text-align: left;
        }
        .ranking-table th, .ranking-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .ranking-table th { color: #7f8c8d; font-size: 0.8rem; }
        .ranking-table td { font-weight: bold; }
        .ranking-rank { width: 40px; text-align: center; color: var(--accent-color); }
        .ranking-time { text-align: right; }
        .ranking-date { font-size: 0.8rem; color: #95a5a6; text-align: right;}

        /* レスポンシブ調整 */
        @media (min-width: 600px) {
            h1 { font-size: 1.5rem; }
            .card { font-size: 1.1rem; }
            #game-board { gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>都道府県・県庁所在地マッチ</h1>
        <div class="stats-bar">
            <div class="timer-display">TIME: <span id="timer">0.0</span>s</div>
            <div class="highscore-display">BEST: <span id="best-score">--</span></div>
        </div>
    </header>

    <div id="game-board">
        <!-- カードはJSで生成されます -->
    </div>

    <!-- ゲーム中のコントロール -->
    <div class="controls" id="game-controls" style="display: none;">
        <button class="btn btn-secondary" onclick="confirmReset()">リセット</button>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="overlay show">
        <div class="modal-box">
            <div class="modal-title">都道府県<br>県庁所在地マッチ</div>
            <p>カードをドラッグして<br>正しいペアを作ろう！</p>
            <div style="margin-top: 20px;">
                <button class="btn btn-accent" onclick="startGame()">スタート</button>
                <br>
                <button class="btn btn-secondary" onclick="showRanking()">ランキングを見る</button>
            </div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="overlay">
        <div class="modal-box">
            <div class="modal-title">GAME CLEAR!</div>
            <p>タイム: <span id="final-time" style="font-size: 1.8rem; font-weight: bold; color: var(--accent-color);"></span> 秒</p>
            <p id="new-record-msg" style="color: #f1c40f; font-weight: bold; display: none;">🎉 ランクイン！ 🎉</p>
            <div style="margin-top: 20px;">
                <button class="btn btn-accent" onclick="startGame()">もう一度遊ぶ</button>
                <br>
                <button class="btn btn-secondary" onclick="showRanking()">ランキングを見る</button>
            </div>
        </div>
    </div>

    <!-- ランキング画面 -->
    <div id="ranking-screen" class="overlay">
        <div class="modal-box">
            <div class="modal-title">ランキング (TOP 5)</div>
            <div id="ranking-list">
                <!-- JSで挿入 -->
            </div>
            <div style="margin-top: 20px;">
                <button class="btn" onclick="closeRanking()">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // --- データソース ---
        const PREF_DATA = [
            { id: 1, pref: '北海道', city: '札幌' }, { id: 2, pref: '岩手', city: '盛岡' },
            { id: 3, pref: '宮城', city: '仙台' }, { id: 4, pref: '茨城', city: '水戸' },
            { id: 5, pref: '栃木', city: '宇都宮' }, { id: 6, pref: '群馬', city: '前橋' },
            { id: 7, pref: '神奈川', city: '横浜' }, { id: 8, pref: '石川', city: '金沢' },
            { id: 9, pref: '山梨', city: '甲府' }, { id: 10, pref: '愛知', city: '名古屋' },
            { id: 11, pref: '三重', city: '津' }, { id: 12, pref: '滋賀', city: '大津' },
            { id: 13, pref: '兵庫', city: '神戸' }, { id: 14, pref: '島根', city: '松江' },
            { id: 15, pref: '香川', city: '高松' }, { id: 16, pref: '愛媛', city: '松山' },
            { id: 17, pref: '沖縄', city: '那覇' }
        ];

        // --- 変数管理 ---
        let startTime = 0;
        let timerInterval = null;
        let isPlaying = false;
        let matchedCount = 0;
        const PAIRS_TO_USE = 8;
        const RANKING_KEY = 'prefGameRankingV2';

        // --- DOM要素 ---
        const boardEl = document.getElementById('game-board');
        const timerEl = document.getElementById('timer');
        const bestScoreEl = document.getElementById('best-score');
        const startScreenEl = document.getElementById('start-screen');
        const resultScreenEl = document.getElementById('result-screen');
        const rankingScreenEl = document.getElementById('ranking-screen');
        const gameControlsEl = document.getElementById('game-controls');
        
        // --- 初期化 ---
        updateBestScoreDisplay();

        // --- ゲーム進行 ---
        function startGame() {
            // UIリセット
            startScreenEl.classList.remove('show');
            resultScreenEl.classList.remove('show');
            rankingScreenEl.classList.remove('show');
            gameControlsEl.style.display = 'block';

            stopTimer();
            timerEl.innerText = "0.0";
            isPlaying = true;
            matchedCount = 0;
            
            // データ生成
            const selectedPairs = shuffleArray([...PREF_DATA]).slice(0, PAIRS_TO_USE);
            let cards = [];
            selectedPairs.forEach(pair => {
                cards.push({ id: pair.id, text: pair.pref, type: 'pref', pairId: pair.id });
                cards.push({ id: pair.id, text: pair.city, type: 'city', pairId: pair.id });
            });
            cards = shuffleArray(cards);
            
            renderBoard(cards);
            startTimer();
        }

        function confirmReset() {
            if(confirm('ゲームをやり直しますか？')) {
                startGame();
            }
        }

        function renderBoard(cards) {
            boardEl.innerHTML = '';
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card type-${card.type}`;
                cardEl.innerText = card.text;
                cardEl.dataset.pairId = card.pairId;
                cardEl.dataset.type = card.type;
                // Pointer Event登録
                cardEl.addEventListener('pointerdown', handleDragStart);
                boardEl.appendChild(cardEl);
            });
        }

        // --- ドラッグ＆ドロップ (Pointer Events) ---
        let currentDragEl = null;
        let placeholderEl = null;
        let dragOffsetX, dragOffsetY;

        function handleDragStart(e) {
            if (!isPlaying) return;
            const target = e.currentTarget;
            if (target.classList.contains('matched')) return;

            e.preventDefault();
            currentDragEl = target;
            const rect = target.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            // プレースホルダー作成
            placeholderEl = document.createElement('div');
            placeholderEl.className = 'placeholder';
            boardEl.insertBefore(placeholderEl, currentDragEl);

            // ドラッグ要素スタイル
            currentDragEl.classList.add('dragging');
            currentDragEl.style.width = `${rect.width}px`;
            currentDragEl.style.height = `${rect.height}px`;
            currentDragEl.style.left = `${rect.left}px`;
            currentDragEl.style.top = `${rect.top}px`;

            window.addEventListener('pointermove', handleDragMove);
            window.addEventListener('pointerup', handleDragEnd);
            
            moveAt(e.clientX, e.clientY);
        }

        function moveAt(x, y) {
            currentDragEl.style.left = `${x - dragOffsetX}px`;
            currentDragEl.style.top = `${y - dragOffsetY}px`;
        }

        function handleDragMove(e) {
            if (!currentDragEl) return;
            e.preventDefault();
            moveAt(e.clientX, e.clientY);
        }

        function handleDragEnd(e) {
            if (!currentDragEl) return;
            
            currentDragEl.style.visibility = 'hidden';
            let elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            currentDragEl.style.visibility = 'visible';
            
            let targetCard = elemBelow ? elemBelow.closest('.card') : null;

            if (targetCard && targetCard !== currentDragEl && !targetCard.classList.contains('matched')) {
                checkMatch(currentDragEl, targetCard);
            } else {
                returnToOriginalPosition();
            }

            window.removeEventListener('pointermove', handleDragMove);
            window.removeEventListener('pointerup', handleDragEnd);
        }

        function checkMatch(dragged, target) {
            const id1 = dragged.dataset.pairId;
            const id2 = target.dataset.pairId;
            const type1 = dragged.dataset.type;
            const type2 = target.dataset.type;

            if (id1 === id2 && type1 !== type2) {
                // 正解
                resetDragStyles(dragged);
                dragged.classList.add('matched');
                target.classList.add('matched');
                matchedCount++;
                if (matchedCount === PAIRS_TO_USE) gameClear();
            } else {
                // 不正解
                returnToOriginalPosition();
                setTimeout(() => {
                    target.classList.add('shake');
                    dragged.classList.add('shake');
                    setTimeout(() => {
                        target.classList.remove('shake');
                        dragged.classList.remove('shake');
                    }, 400);
                }, 50);
            }
        }

        function returnToOriginalPosition() {
            resetDragStyles(currentDragEl);
        }

        function resetDragStyles(el) {
            el.classList.remove('dragging');
            el.style.width = ''; el.style.height = '';
            el.style.left = ''; el.style.top = '';
            
            if (placeholderEl && placeholderEl.parentNode) {
                placeholderEl.parentNode.replaceChild(el, placeholderEl);
            }
            placeholderEl = null;
            currentDragEl = null;
        }

        // --- ゲームクリア・ランキング処理 ---
        function gameClear() {
            stopTimer();
            isPlaying = false;
            const score = parseFloat(timerEl.innerText);
            
            // ランキング保存と判定
            const isRankIn = saveScore(score);

            // リザルト表示
            document.getElementById('final-time').innerText = score;
            const msg = document.getElementById('new-record-msg');
            msg.style.display = isRankIn ? 'block' : 'none';
            if(isRankIn) msg.innerText = "🎉 ランクイン！ 🎉";
            
            setTimeout(() => {
                resultScreenEl.classList.add('show');
                updateBestScoreDisplay();
            }, 500);
        }

        function saveScore(score) {
            let ranking = JSON.parse(localStorage.getItem(RANKING_KEY)) || [];
            const newEntry = {
                time: score,
                date: new Date().toLocaleDateString()
            };
            
            ranking.push(newEntry);
            // タイム昇順ソート
            ranking.sort((a, b) => a.time - b.time);
            // 上位5件に絞る
            ranking = ranking.slice(0, 5);
            
            localStorage.setItem(RANKING_KEY, JSON.stringify(ranking));

            // 今回のスコアがランキングに含まれているか判定（同一スコアがある場合も考慮）
            // 厳密にはユニークID等が必要だが、簡易的に「5位以内に入ったか」で判定
            const isRankIn = ranking.some(r => r.time === score && r.date === newEntry.date);
            return isRankIn;
        }

        function getRanking() {
            return JSON.parse(localStorage.getItem(RANKING_KEY)) || [];
        }

        function showRanking() {
            const ranking = getRanking();
            const listEl = document.getElementById('ranking-list');
            
            if (ranking.length === 0) {
                listEl.innerHTML = '<p style="color:#7f8c8d; padding:20px;">まだ記録がありません。<br>ゲームをクリアして記録を作ろう！</p>';
            } else {
                let html = '<table class="ranking-table"><thead><tr><th class="ranking-rank">順位</th><th>タイム</th><th>日付</th></tr></thead><tbody>';
                ranking.forEach((entry, index) => {
                    let rankIcon = index + 1;
                    if(index === 0) rankIcon = '🥇';
                    else if(index === 1) rankIcon = '🥈';
                    else if(index === 2) rankIcon = '🥉';

                    html += `
                        <tr>
                            <td class="ranking-rank">${rankIcon}</td>
                            <td class="ranking-time">${entry.time.toFixed(1)}s</td>
                            <td class="ranking-date">${entry.date}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                listEl.innerHTML = html;
            }

            // モーダル制御（他のモーダルが開いていれば閉じるのではなく、上に被せるか切り替える）
            startScreenEl.classList.remove('show'); // スタート画面から呼ばれた場合一旦閉じる
            resultScreenEl.classList.remove('show');
            rankingScreenEl.classList.add('show');
        }

        function closeRanking() {
            rankingScreenEl.classList.remove('show');
            // ゲーム中なら何も戻さない、未開始ならスタート画面へ、クリア後ならリザルトへ戻す
            // 簡易的に「isPlayingがfalseでタイムが0ならスタート画面」「それ以外でタイムありならリザルト」と判定
            if (!isPlaying && timerEl.innerText === "0.0") {
                startScreenEl.classList.add('show');
            } else if (!isPlaying && parseFloat(timerEl.innerText) > 0) {
                resultScreenEl.classList.add('show');
            } else {
                // ゲーム中（ポーズ機能はないが、一応）
                // 通常ここには来ない（ゲーム中にランキングボタンはないため）
            }
        }

        function updateBestScoreDisplay() {
            const ranking = getRanking();
            if (ranking.length > 0) {
                bestScoreEl.innerText = ranking[0].time.toFixed(1) + 's';
            } else {
                bestScoreEl.innerText = '--';
            }
        }

        // --- タイマー ---
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = (now - startTime) / 1000;
                timerEl.innerText = diff.toFixed(1);
            }, 100);
        }
        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
</body>
</html>
